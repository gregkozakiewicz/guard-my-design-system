name: guard-my-design-system
description: "Your design system dies one pull request at a time. This makes sure it doesn't. Judges only the lines a PR adds."
branding:
  icon: shield
  color: gray-dark

inputs:
  strict:
    description: "Fail the check instead of commenting (true/false)"
    default: "false"
  exclude:
    description: "Comma-separated repo-relative paths to leave out of the system scan"
    default: ""

runs:
  using: composite
  steps:
    - name: Guard the diff
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        STRICT: ${{ inputs.strict }}
        EXCLUDE: ${{ inputs.exclude }}
        # composite actions do not inherit the token; hand it over explicitly
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
        ARGS=(--base "$BASE_SHA" --json)
        [ -n "$EXCLUDE" ] && ARGS+=(--exclude "$EXCLUDE")
        npx -y guard-my-design-system "${ARGS[@]}" > guard-findings.json
        node ${{ github.action_path }}/scripts/pr-comment.mjs guard-findings.json
        if [ "$STRICT" = "true" ]; then
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('guard-findings.json','utf8')).findings.length)")
          if [ "$COUNT" != "0" ]; then
            echo "guard: $COUNT new issue(s) — strict mode fails the check"
            exit 1
          fi
        fi
